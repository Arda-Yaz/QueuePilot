    - reports/metrics/baseline_tune_predictions.csv:
        cache: false
    metrics:
    - reports/metrics/baseline_tune_calibration_metrics.json:
        cache: false
  evaluate_calibration_baseline:
    cmd: python -m src.evaluate_calibration_baseline
    deps:
    - artifacts/baseline.joblib
    - reports/data/calibration_ids.csv
