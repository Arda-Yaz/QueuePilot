stages:
  prepare_data:
    cmd: python -m src.prepare_data
    deps:
    - data/raw/all_tickets_processed_improved_v3.csv
    - src/prepare_data.py
    - src/data.py
    - src/hashing.py
    - src/paths.py
    - src/ticket_text.py
    - requirements/dev.txt
    outs:
    - reports/data/data_manifest.json:
        cache: false
    - reports/data/data_quality_report.json:
        cache: false
    - reports/data/train_ids.csv:
        cache: false
    - reports/data/tune_ids.csv:
        cache: false
    - reports/data/calibration_ids.csv:
        cache: false
    - reports/data/test_ids.csv:
        cache: false
  train_baseline:
    cmd: python -m src.train_baseline
    deps:
    - src/__init__.py
    - src/analyze_threshold_baseline.py
    - src/analyze_threshold_cnn.py
    - src/cnn_data.py
    - src/cnn_evaluation.py
    - src/compare_models.py
    - src/data.py
    - src/error_summary.py
    - src/evaluate.py
    - src/evaluate_baseline.py
    - src/evaluate_calibration_baseline.py
    - src/evaluate_calibration_cnn.py
    - src/evaluate_cnn.py
    - src/evaluate_routing.py
    - src/evaluate_routing_baseline.py
    - src/evaluate_tune_baseline.py
    - src/evaluate_tune_cnn.py
    - src/hashing.py
    - src/inference.py
    - src/paths.py
    - src/plot_results.py
    - src/prediction.py
    - src/prediction_provenance.py
    - src/prepare_data.py
    - src/provenance.py
    - src/routing_utils.py
    - src/run_evaluation_pipeline.py
    - src/select_model.py
    - src/textcnn.py
    - src/threshold_analysis.py
    - src/ticket_text.py
    - src/tracking.py
    - src/train_baseline.py
    - src/train_cnn.py
    - requirements/base.in
    - requirements/base.txt
    - requirements/cnn.in
    - requirements/cnn.txt
    - requirements/cuda.in
    - requirements/cuda.txt
    - requirements/dev.in
    - requirements/dev.txt
    - requirements/mlops.in
    - requirements/mlops.txt
    - requirements/train.in
    - requirements/train.txt
    - params.yaml
    - pyproject.toml
    - .gitattributes
    - data/raw/all_tickets_processed_improved_v3.csv
    - reports/data/train_ids.csv
    - reports/data/tune_ids.csv
    - reports/data/data_manifest.json
    - reports/data/calibration_ids.csv
    - reports/data/test_ids.csv
    params:
    - baseline.ngram_range
    - baseline.min_df
    - baseline.max_df
    - baseline.max_features
    - baseline.max_iter
    - baseline.class_weight
    outs:
    - artifacts/baseline.joblib
    - artifacts/baseline_metadata.json:
        cache: false
    metrics:
    - reports/metrics/baseline_tune_metrics.json:
        cache: false
  evaluate_tune_baseline:
    cmd: python -m src.evaluate_tune_baseline
    deps:
    - artifacts/baseline.joblib
    - reports/data/tune_ids.csv
    - reports/data/data_manifest.json
    - src/evaluate_tune_baseline.py
    - src/data.py
    - src/evaluate.py
    - src/paths.py
    - src/hashing.py
    - src/ticket_text.py
